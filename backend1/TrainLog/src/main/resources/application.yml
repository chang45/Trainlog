server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: trainlog-backend
  profiles:
    active: dev
  data:
    redis:
      host: ${trainlog.redis.host}
      port: ${trainlog.redis.port}
      database: ${trainlog.redis.database}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${trainlog.datasource.host}:${trainlog.datasource.port}/${trainlog.datasource.database}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true"
    username: ${trainlog.datasource.username}
    password: ${trainlog.datasource.password}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

app:
  jwt:
    admin-secret-key: ${trainlog.jwt.admin-secret-key}
    admin-ttl: ${trainlog.jwt.admin-ttl}
    admin-token-name: ${trainlog.jwt.admin-token-name}

  captcha:
    length: 4
    ttl-seconds: 120
    width: 120
    height: 40
    log-code: true
  register:
    enabled: ${REGISTER_ENABLED:true}
    invite-code: ${REGISTER_INVITE_CODE:}
  security:
    captcha-per-minute: 20
    login-per-minute: 10
    register-per-minute: 5
    register-per-hour: 3
    max-failures: 5
    failure-window-seconds: 600
    lock-seconds: 600
  seed:
    username: ${trainlog.user.username}
    password: ${trainlog.user.password}
    nickname: ${trainlog.user.nickname}

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173


ark:
  api-key: ${trainlog.ark.api-key:}
  base-url: ${trainlog.ark.base-url:https://ark.cn-beijing.volces.com/api/v3}
  model: ${trainlog.ark.model:}
  connect-timeout-seconds: ${trainlog.ark.connect-timeout-seconds:10}
  timeout-seconds: ${trainlog.ark.timeout-seconds:60}
  retry-times: ${trainlog.ark.retry-times:1}

logging:
  file:
    name: logs/trainlog.log
  level:
    root: INFO
    org.examplexxx.trainlog: DEBUG
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: trainLog项目接口文档
    version: "2.0"
    description: trainLog项目接口文档
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.examplexxx.trainlog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

